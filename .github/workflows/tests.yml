name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    # Windows PowerShell 5.1 - what RUN-ME.bat uses on every user's machine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the test suite
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1

  pwsh-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run-Tests.ps1
