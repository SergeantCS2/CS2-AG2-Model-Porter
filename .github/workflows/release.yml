name: release

# On every pull request: build the two downloads, so a missing file shows up
# before a release rather than after. On a version tag (v1.3.0): build them
# and attach them to a DRAFT release, with that version's CHANGELOG section as
# the text. Nothing is published until you publish the draft yourself.

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release zips
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/package_release.py dist --version "$GITHUB_REF_NAME" --notes dist/notes.md
          else
            python3 tools/package_release.py dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist
      - name: Attach to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "$TAG is already published - not replacing its files. The zips are in this run's artifacts."
            fi
          else
            gh release create "$TAG" dist/*.zip --draft --title "$TAG" --notes-file dist/notes.md --repo "$GITHUB_REPOSITORY"
          fi
